name: gambit
title: Gambit for Hermes
repo: "https://github.com/itsflownium/gambit-hackathon"
sha: "TODO_FULL_40_HEX_MERGED_RELEASE_COMMIT_SHA"
description: Play chess in a Hermes terminal or Desktop pane, understand mistakes, and replay or practice public Chess.com and Lichess matches.
maintainer: itsflownium
tier: community
category: tools
requires_hermes: ">=0.23.0"
version: "0.3.0"
readme: true
# macOS is the only established platform; final-pin acceptance is pending.
# No separate-machine, Linux or Windows compatibility claim has been established.
platforms: [macos]
# Plugin source lives at the public repository root; no subdir is needed.
# Set docs_url and screenshots to the verified final source commit in the PR.
# Replace [] with up to six commit-pinned HTTPS GitHub-hosted screenshot URLs.
# Final choices: docs/terminal-preview.png and docs/import-preview.png.
# The terminal image is the reviewed real feedback frame from the 88-second film.
screenshots: []
known_issues:
  - Requires a separately installed local Stockfish executable; it is not bundled or downloaded automatically. Hermes Desktop is optional for the graphical pane.
  - The standalone terminal board requires an interactive terminal with Python curses support and uses a separate Gambit session.
  - Hermes skips standalone CLI command registration with plugins.isolation set to host; /chess remains available in a Hermes conversation.
  - Slash shortcuts return direct board or engine evidence; use ordinary chat or the standalone coaching pane for model explanations.
  - Full-match recap completion is announced through Desktop only. CLI/TUI can retrieve the result later; the standalone dashboard has no summary command.
  - Imports completed public standard-chess games only; source publication delays and rate limits may apply.
  - Chess.com Bot and Coach games are unavailable through public username lookup.
  - Uses the configured Hermes provider for moves and coaching; normal provider usage and charges apply.
  - The 60-second deadline applies to board replies; conversational coaching has the host provider's response time.
  - Catalogue scope is macOS only; Linux, Windows and another physical computer have not been verified.
capabilities:
  provides_tools:
    - chess_state
    - chess_start
    - chess_move
    - chess_games
    - chess_replay
    - chess_review
    - chess_hint
    - chess_action
  provides_hooks:
    - pre_llm_call
  provides_middleware: []
  requires_env: []
