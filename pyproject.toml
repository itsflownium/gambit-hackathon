[project]
name = "hermes-gambit"
version = "0.3.0"
description = "Chess for Hermes terminals and Desktop: play, import, replay, and learn."
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = ["chess>=1.11.2,<2", "httpx>=0.28.1,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
